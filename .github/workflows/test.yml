name: Test
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node build.mjs
      - run: node --check client.js
      - run: node --test queue-core.test.mjs preview-core.test.mjs
      - run: git diff --exit-code -- client.js
