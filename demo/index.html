<!doctype html><html lang="zh-CN" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HTML 批注交互验证</title><link rel="stylesheet" href="test-fixture.css"><script src="test-fixture.js"></script><style>:root{--bg:#f8faf9;--t1:#122c31;--t2:#3f5a5e;--t3:#526a6d;--accent:#39e5b8;--accent-text:#07634e;--line:#c9d8d6;--font-cn:-apple-system,system-ui,"PingFang SC",sans-serif;--font-mono:Menlo,monospace}*{box-sizing:border-box}body{margin:0;padding:48px 32px;background:var(--bg);color:var(--t1);font:16px/1.7 var(--font-cn);font-variant-numeric:tabular-nums}main{max-width:880px;margin:auto}h1{font-size:48px;line-height:1.25;max-width:14em;margin:0 0 24px}p{color:var(--t2);max-width:36em}section{margin-top:48px;border-top:1px solid var(--line);padding-top:24px}h2{font-size:24px}button{padding:12px 24px;border:1px solid var(--line);background:var(--accent);color:var(--t1);border-radius:8px;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid var(--accent-text)}button:hover{filter:brightness(.95)}.steps{display:flex;gap:32px;flex-wrap:wrap}.steps p{flex:1;min-width:180px}strong{display:block;color:var(--t1)}@media(max-width:600px){body{padding:32px 24px}h1{font-size:40px}}</style></head><body><main><h1 id="report-title">让页面修改，从你指的位置开始。</h1><p>这是一份用于验证插件交互的本地 HTML。点击标题、正文或按钮，在右侧输入修改意见；每项任务会按发送顺序执行。</p><section><h2>三个动作，完成一次修改</h2><div class="steps"><p><strong>01 · 指定位置</strong>直接在预览页面中点选需要调整的元素。</p><p><strong>02 · 说明改法</strong>输入具体修改意见，也可以积累多条批注。</p><p><strong>03 · 交给 Agent</strong>保存为任务，在当前会话里排队执行。</p></div><button id="fixture-action" onclick="this.textContent='浏览交互已验证'">体验页面交互</button></section></main></body></html>
